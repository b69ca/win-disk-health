name: validate-and-package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.403'
      - name: Build and behavior checks
        shell: pwsh
        run: ./scripts/Validate.ps1
      - name: Windows PowerShell collector contracts
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/Test-Collector.ps1
      - name: Package standalone Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Package-Windows.ps1
      - name: Verify real Windows collection
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/Smoke-Windows.ps1 -Executable ./artifacts/publish/win-disk-health.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Windows'
        with:
          name: win-disk-health-win-x64
          path: |
            artifacts/dist/win-disk-health-1.0.0-win-x64.zip
            artifacts/dist/SHA256SUMS.txt
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && github.ref == 'refs/tags/v1.0.0'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: win-disk-health-win-x64
          path: dist
      - name: Verify checksum and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS.txt)
          test "$GITHUB_REF_NAME" = v1.0.0
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/win-disk-health-1.0.0-win-x64.zip dist/SHA256SUMS.txt
          else
            gh release create "$GITHUB_REF_NAME" dist/win-disk-health-1.0.0-win-x64.zip dist/SHA256SUMS.txt --verify-tag --title "win-disk-health $GITHUB_REF_NAME" --notes-file CHANGELOG.md
          fi
